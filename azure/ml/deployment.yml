# One instance, smallest useful SKU. The benchmark measures cold start too, so
# the deployment is deliberately not warmed before the run.
$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: blue
endpoint_name: subjectrank-bench

# Overridden at create time with the concrete version:
#
#   V=$(az ml model list -n subjectrank-baseline-logreg -g $RG -w $WS \
#        --query "[?tags.champion=='true'].version | [0]" -o tsv)
#   az ml online-deployment create -f azure/ml/deployment.yml ... \
#        --set model=azureml:subjectrank-baseline-logreg:$V
#
# It used to say `@champion`, which reads well and does not work: the
# azure-ai-ml version pinned here has no alias API, so promote.py marks the
# champion with a tag instead and `model@champion` fails with "Must provide
# either version or label". Resolving the tag at create time keeps one source of
# truth about which version is champion -- promote.py -- without pretending an
# alias exists.
model: azureml:subjectrank-baseline-logreg:1

# The repo travels with the deployment because score.py imports the SAME Python
# feature extractor the training run used. Shipping only the graph would mean
# reimplementing feature extraction inside the scoring image, which is the skew
# this project spends a whole parity suite preventing.
code_configuration:
  code: ../..
  scoring_script: azure/ml/score.py

environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04:latest
  conda_file: ./conda.yml

instance_type: Standard_DS2_v2
instance_count: 1

request_settings:
  request_timeout_ms: 10000
  max_concurrent_requests_per_instance: 4

liveness_probe:
  initial_delay: 20
  period: 30
  timeout: 5
  failure_threshold: 3
