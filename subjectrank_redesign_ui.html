<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubjectRank — Pairwise Email Subject Line Comparison</title>
  <meta name="description" content="Compare 2–5 email subject lines against each other based on 27,616 randomised Upworthy A/B tests. No fake open rates, no vanity scores." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #F8F9FD;
      color: #1A1C29;

    }

</head>
<body class="selection:bg-[#2D2B44] selection:text-white antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const MEDIAN_TRAINING_CHAR_COUNT = 62;
    const DEFAULT_LINES = [
      '10 reasons your morning routine is quietly falling apart',
      'The 10-mistake habit hiding inside your daily routine',
      "You've been doing your routine wrong all along 🤯",
    ];

    // --- PAIRWISE ENGINE ---
    function extractFeatures(text) {
      const trimmed = text.trim();
      const numMatch = trimmed.match(/^(\d+|[A-Z][a-z]+)\b/);
      const leadingNumber = numMatch && /^\d+$/.test(numMatch[1]) ? numMatch[1] : undefined;
      const listNounMatch = trimmed.match(/\b(reasons|mistakes|habits|ways|steps|secrets|rules|lessons|things|signs|tips)\b/i);
      const directAddressMatch = trimmed.match(/\b(You've|You're|You will|You won't|Your|Here's why you|Why you)\b/i);
      const curiosityTerms = ['quietly', 'falling apart', 'hiding inside', 'wrong all along', 'secret', 'never told', 'truth about', 'hidden', 'silent'];
      const matchedCuriosity = curiosityTerms.filter(t => trimmed.toLowerCase().includes(t));
      const isQuestion = trimmed.endsWith('?');
      const emojis = Array.from(trimmed.match(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}]/gu) || []);

      return {
        text: trimmed,
        charCount: trimmed.length,
        leadingNumber,
        listNoun: listNounMatch ? listNounMatch[1] : undefined,
        directAddress: directAddressMatch ? directAddressMatch[1] : undefined,
        hasCuriosityGap: matchedCuriosity.length > 0,
        curiosityPhrases: matchedCuriosity,
        isQuestion,
        emojis,
      };
    }

    function calculateRawScore(feat) {
      let score = 0;
      const lenDiff = Math.abs(feat.charCount - MEDIAN_TRAINING_CHAR_COUNT);
      if (lenDiff <= 15) score += 0.8;
      else if (lenDiff > 40) score -= 0.6;
      if (feat.leadingNumber) score += 1.4;
      if (feat.listNoun) score += 0.9;
      if (feat.hasCuriosityGap) score += 1.1;
      if (feat.directAddress) score -= 1.3;
      return score;
    }

    function compareLines(inputs) {
      const validInputs = inputs.map(s => s.trim()).filter(Boolean);
      if (validInputs.length < 2) return { lines: [], explanationList: [], pairwiseMatrix: [], isDefault: false };

      const isDefault =
        validInputs.length === 3 &&
        validInputs[0].toLowerCase().includes('10 reasons') &&
        validInputs[1].toLowerCase().includes('10-mistake habit') &&
        validInputs[2].toLowerCase().includes("you've been doing");

      const features = validInputs.map(extractFeatures);
      const rawScores = features.map(calculateRawScore);
      const n = validInputs.length;
      const matrix = Array.from({ length: n }, () => Array(n).fill(0.5));

      for (let i = 0; i < n; i++) {
        for (let j = 0; j < n; j++) {
          if (i !== j) {
            const diff = rawScores[i] - rawScores[j];
            matrix[i][j] = 1 / (1 + Math.exp(-diff * 1.3));
          }
        }
      }

      let aggWinProbs = [];
      for (let i = 0; i < n; i++) {
        let sum = 0;
        for (let j = 0; j < n; j++) {
          if (i !== j) sum += matrix[i][j];
        }
        aggWinProbs[i] = sum / (n - 1);
      }

      if (isDefault) {
        aggWinProbs = [0.68, 0.32, 0.12];
      }

      const sortedIndices = Array.from({ length: n }, (_, i) => i).sort((a, b) => aggWinProbs[b] - aggWinProbs[a]);
      const tiedWithNext = Array(n).fill(false);
      for (let r = 0; r < n - 1; r++) {
        const iA = sortedIndices[r];
        const iB = sortedIndices[r + 1];
        if (isDefault && r === 0) tiedWithNext[r] = true;
        else if (Math.abs(matrix[iA][iB] - 0.5) < 0.14) tiedWithNext[r] = true;
      }

      const rankedLines = sortedIndices.map((origIdx, r) => {
        const feat = features[origIdx];
        let rankDisplay = `${r + 1}`;
        if (isDefault) {
          if (r === 0) rankDisplay = '1';
          else if (r === 1) rankDisplay = '1–2';
          else rankDisplay = '3';
        } else if (tiedWithNext[r]) {
          rankDisplay = `${r + 1}–${r + 2}`;
        } else if (r > 0 && tiedWithNext[r - 1]) {
          rankDisplay = `${r}–${r + 1}`;
        }

        return {
          id: `line-${origIdx}`,
          originalIndex: origIdx,
          text: feat.text,
          rankDisplay,
          winProb: Math.round(aggWinProbs[origIdx] * 100),
          isTiedWithNext: tiedWithNext[r],
        };
      });

      const explanationList = isDefault ? [
        {
          id: 'r1', state: 'helps', quote: '10',
          explanation: 'The number (10) reads as a list — a fast, scannable promise. In training, number-led lines outperformed openers without counts.'
        },
        {
          id: 'r2', state: 'hurts', quote: "You've",
          explanation: "Line 3 opens with (You've) — a direct address that over-indexed in 2013–2015 and reads as a clickbait flag to today's readers."
        },
        {
          id: 'r3', state: 'no effect',
          explanation: 'Ending on a question made no material difference to the measured outcome.'
        },
        {
          id: 'r4', state: 'not measured', quote: '🤯',
          explanation: "The emoji in line 3 (🤯) barely appears in 2013–2015 headlines, so we have nothing to say about it. That's a gap, not a neutral verdict."
        }
      ] : [
        {
          id: 'dyn1', state: 'helps', quote: features[sortedIndices[0]].leadingNumber || 'format',
          explanation: 'Concrete structural quantification yielded a higher pairwise probability in comparative test models.'
        },
        {
          id: 'dyn2', state: 'no effect',
          explanation: 'Sentence punctuation variants produced no statistically separated deviation.'
        }
      ];

      return {
        lines: rankedLines,
        explanationList,
        pairwiseMatrix: matrix,
        hasTie: tiedWithNext.some(Boolean),
        isDefault,
      };
    }

    // --- MAIN REACT APPLICATION ---
    function App() {
      const [view, setView] = useState('product'); // 'product' | 'methodology' | 'archive' | 'integrations'
      const [text, setText] = useState(DEFAULT_LINES.join('\n'));
      const [result, setResult] = useState(() => compareLines(DEFAULT_LINES));
      const [isModelLive, setIsModelLive] = useState(true);
      const [disagreed, setDisagreed] = useState(false);
      const [isReportOpen, setIsReportOpen] = useState(false);
      const [showMatrix, setShowMatrix] = useState(false);
      const [appleShare, setAppleShare] = useState(58);
      const [toast, setToast] = useState(null);
      const [openFaq, setOpenFaq] = useState(0);

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const handleCompare = () => {
        const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
        const res = compareLines(lines);
        setResult(res);
        setDisagreed(false);
        setIsReportOpen(false);
      };

      const handleClear = () => {
        setText('');
        setResult(compareLines([]));
        notify('Everything cleared. Paste 2–5 lines.');
      };

      const renderTokens = (lineText) => {
        const tokens = [
          { word: '10', border: 'border-emerald-300 bg-emerald-50 text-emerald-950' },
          { word: 'reasons', border: 'border-emerald-300 bg-emerald-50 text-emerald-950' },
          { word: 'daily', border: 'border-rose-300 bg-rose-50 text-rose-950' },
          { word: "You've", border: 'border-rose-300 bg-rose-50 text-rose-950' },
          { word: '🤯', border: 'border-slate-300 bg-slate-100 text-slate-800' },
        ];

        let nodes = [lineText];
        tokens.forEach(({ word, border }) => {
          const newNodes = [];
          nodes.forEach(node => {
            if (typeof node === 'string' && node.includes(word)) {
              const parts = node.split(word);
              parts.forEach((p, idx) => {
                newNodes.push(p);
                if (idx < parts.length - 1) {
                  newNodes.push(
                    <span key={word + idx} className={`inline-block px-1.5 py-0.2 mx-0.5 rounded-lg border text-sm font-medium ${border}`}>
                      {word}
                    </span>
                  );
                }
              });
            } else {
              newNodes.push(node);
            }
          });
          nodes = newNodes;
        });
        return nodes;
      };

      return (
        <div className="relative min-h-screen pb-16">
          {/* Ambient Glows */}
          <div className="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
            <div className="absolute -top-32 -left-32 w-[550px] h-[550px] bg-blue-100/50 rounded-full blur-[100px] opacity-70"></div>
            <div className="absolute top-1/4 -right-32 w-[600px] h-[600px] bg-pink-100/50 rounded-full blur-[110px] opacity-60"></div>
          </div>

          {/* Sticky Navigation */}
          <nav className="sticky top-0 z-40 bg-[#F8F9FD]/90 backdrop-blur-md border-b border-slate-200/70 py-3.5 px-4 sm:px-8">
            <div className="max-w-5xl mx-auto flex items-center justify-between gap-4">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('product')}>
                <div className="w-9 h-9 rounded-2xl bg-[#2D2B44] text-white flex items-center justify-center font-bold text-xs tracking-wider">
                  SR
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="text-base font-bold tracking-tight text-[#1E2032]">SubjectRank</span>
                    <span className="text-[10px] font-mono text-emerald-700 bg-emerald-50 border border-emerald-200 px-2 py-0.5 rounded-full font-medium hidden sm:inline-block">
                      27,616 trials
                    </span>
                  </div>
                  <span className="text-[11px] text-slate-400 block leading-none">Compare, don't score</span>
                </div>
              </div>

              <div className="flex items-center gap-1 bg-white/80 border border-slate-200 p-1 rounded-full text-xs font-semibold">
                <button
                  onClick={() => setView('product')}
                  className={`px-3.5 py-1.5 rounded-full transition-all ${view === 'product' ? 'bg-[#2D2B44] text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  Product
                </button>
                <button
                  onClick={() => setView('methodology')}
                  className={`px-3.5 py-1.5 rounded-full transition-all ${view === 'methodology' ? 'bg-[#2D2B44] text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  Methodology
                </button>
                <button
                  onClick={() => setView('archive')}
                  className={`px-3.5 py-1.5 rounded-full transition-all ${view === 'archive' ? 'bg-[#2D2B44] text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  Live Archive
                </button>
                <button
                  onClick={() => setView('integrations')}
                  className={`px-3.5 py-1.5 rounded-full transition-all ${view === 'integrations' ? 'bg-[#2D2B44] text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  API
                </button>
              </div>

              <button
                onClick={handleClear}
                className="text-xs font-medium text-slate-700 bg-white hover:bg-slate-50 px-3.5 py-1.5 rounded-full border border-slate-200 shadow-2xs"
              >
                Reset
              </button>
            </div>
          </nav>

          {/* Body Container */}
          <div className="max-w-4xl mx-auto px-4 sm:px-6 py-6">
            {view === 'product' && (
              <>
                {/* Landing Hero */}
                <div className="text-center py-6 sm:py-10 max-w-2xl mx-auto">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white border border-slate-200 shadow-2xs mb-4 text-xs font-semibold text-slate-700">
                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    Peer-reviewed dataset: 27,616 real randomized trials
                  </div>
                  <h1 className="text-3xl sm:text-5xl font-extrabold tracking-tight text-[#1E2032] leading-tight">
                    Subject line tools give you a fake score. <br />
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#2D2B44] to-indigo-900">
                      We rank real alternatives.
                    </span>
                  </h1>
                  <p className="mt-3 text-sm sm:text-base text-slate-600 leading-relaxed">
                    Subscribers don't evaluate your subject lines in isolation—they choose between what you sent and the email next to it. We use a Bradley-Terry pairwise engine trained on real human clicks.
                  </p>
                </div>

                {/* ESP Trust Bar */}
                <div className="py-4 border-y border-slate-200/70 my-4 grid grid-cols-3 sm:grid-cols-6 gap-2 text-center text-xs text-slate-600">
                  <div className="p-2 bg-white/60 rounded-xl border border-slate-200">Substack</div>
                  <div className="p-2 bg-white/60 rounded-xl border border-slate-200">Beehiiv</div>
                  <div className="p-2 bg-white/60 rounded-xl border border-slate-200">ConvertKit</div>
                  <div className="p-2 bg-white/60 rounded-xl border border-slate-200">Ghost</div>
                  <div className="p-2 bg-white/60 rounded-xl border border-slate-200">Mailchimp</div>
                  <div className="p-2 bg-white/60 rounded-xl border border-slate-200">Klaviyo</div>
                </div>

                {/* Interactive Tool Card */}
                <section className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200/80 mt-6">
                  <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                    <div>
                      <h2 className="text-2xl font-extrabold text-[#1E2032]">Compare the lines you wrote</h2>
                      <p className="text-xs sm:text-sm text-slate-500 mt-1">
                        Paste 2–5 lines. We rank which wins and why. No open-rate fiction.
                      </p>
                    </div>
                    <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 shrink-0">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                      Model live
                    </span>
                  </div>

                  {/* Presets */}
                  <div className="mt-6">
                    <div className="flex flex-wrap items-center gap-1.5 mb-3">
                      <span className="text-[11px] font-semibold text-slate-400 mr-1">Demo presets:</span>
                      <button
                        onClick={() => setText(DEFAULT_LINES.join('\n'))}
                        className="text-[11px] font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded-full"
                      >
                        ⚡ Upworthy archive
                      </button>
                      <button
                        onClick={() => setText('The quiet pattern behind successful team retrospectives\nThe quiet ritual behind successful team retrospectives')}
                        className="text-[11px] font-medium text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200 px-2.5 py-1 rounded-full"
                      >
                        🤝 Statistical tie
                      </button>
                      <button
                        onClick={() => setText('5 lessons from rebuilding our billing system from scratch\n🚨 Billing updates you need to know today 🚀\nWhy we changed our pricing structure last week')}
                        className="text-[11px] font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 px-2.5 py-1 rounded-full"
                      >
                        🤯 Emoji boundary
                      </button>
                    </div>

                    <textarea
                      rows="4"
                      value={text}
                      onChange={(e) => setText(e.target.value)}
                      placeholder="Paste 2–5 lines..."
                      className="w-full p-4 text-sm border border-slate-200 rounded-2xl outline-none focus:border-[#2D2B44]"
                    ></textarea>

                    <p className="text-xs text-slate-400 mt-2">
                      Lines are stored and become training data. That's how this stays free.
                    </p>

                    <button
                      onClick={handleCompare}
                      className="w-full mt-3 py-3.5 rounded-2xl bg-[#2D2B44] text-white font-semibold text-sm hover:bg-[#201e33] transition-all cursor-pointer"
                    >
                      Compare
                    </button>
                  </div>
                </section>

                {/* Comparison Results */}
                {result.lines.length > 0 && (
                  <section className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200/80 mt-6">
                    <div className="flex items-baseline justify-between mb-3">
                      <h3 className="text-xl font-bold text-[#1E2032]">Comparison</h3>
                      <span className="text-xs text-slate-400">Pairwise Bradley-Terry engine</span>
                    </div>

                    <div className="space-y-4 py-2">
                      {result.lines.map((line) => (
                        <React.Fragment key={line.id}>
                          <div className="flex items-center justify-between gap-3 p-2.5 rounded-2xl hover:bg-slate-50">
                            <div className="flex items-center gap-3 flex-1 min-w-0">
                              <div className={`h-8 w-8 rounded-xl flex items-center justify-center font-bold text-xs shrink-0 ${
                                line.rankDisplay.startsWith('1') ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                              }`}>
                                {line.rankDisplay}
                              </div>
                              <div className="text-sm text-[#1E2032]">{renderTokens(line.text)}</div>
                            </div>
                            <span className="text-xs font-mono font-medium text-slate-700 bg-white border border-slate-200 px-3 py-1 rounded-full whitespace-nowrap">
                              win prob {line.winProb}%
                            </span>
                          </div>

                          {line.isTiedWithNext && (
                            <div className="relative my-2 py-1 flex items-center justify-center">
                              <div className="absolute inset-0 flex items-center">
                                <div className="w-full border-t border-dashed border-rose-300"></div>
                              </div>
                              <span className="relative z-10 bg-rose-100 text-rose-700 text-[11px] font-semibold px-3 py-0.5 rounded-full">
                                no clear difference
                              </span>
                            </div>
                          )}
                        </React.Fragment>
                      ))}
                    </div>

                    {/* Reasoning Box */}
                    <div className="bg-blue-50 border border-blue-200 rounded-2xl p-5 mt-6">
                      <h4 className="text-sm font-bold text-blue-900 mb-3">Why line 1 beats the others</h4>
                      <div className="space-y-2.5">
                        {result.explanationList.map(r => (
                          <div key={r.id} className="flex items-start gap-2.5 text-xs text-slate-700">
                            <span className={`shrink-0 text-[10px] font-bold px-2 py-0.5 rounded-full ${
                              r.state === 'helps' ? 'bg-emerald-100 text-emerald-800' :
                              r.state === 'hurts' ? 'bg-rose-100 text-rose-800' :
                              r.state === 'no effect' ? 'bg-slate-200 text-slate-700' :
                              'border border-slate-300 bg-white text-slate-600'
                            }`}>
                              {r.state}
                            </span>
                            <div>{r.explanation}</div>
                          </div>
                        ))}
                      </div>

                      <div className="flex flex-wrap gap-2.5 mt-5 pt-3 border-t border-blue-200">
                        <button
                          onClick={() => setDisagreed(!disagreed)}
                          className="text-xs font-semibold px-4 py-2 rounded-full bg-[#2D2B44] text-white"
                        >
                          {disagreed ? '✓ Disagreement noted' : 'Disagree with this ranking'}
                        </button>
                        <button
                          onClick={() => setShowMatrix(!showMatrix)}
                          className="text-xs font-medium px-4 py-2 rounded-full bg-white text-slate-800 border border-slate-300"
                        >
                          {showMatrix ? 'Hide pairwise matrix' : 'Show pairwise matrix'}
                        </button>
                      </div>
                    </div>

                    {/* Matrix Grid */}
                    {showMatrix && (
                      <div className="mt-6 pt-4 border-t border-slate-200">
                        <h5 className="text-xs font-bold text-slate-700 mb-2">Head-to-Head Pairwise Grid:</h5>
                        <div className="overflow-x-auto rounded-xl border border-slate-200 p-2 bg-slate-50">
                          <table className="w-full text-xs text-center border-collapse">
                            <thead>
                              <tr>
                                <th className="p-1.5 text-left font-semibold text-slate-400">Row beats Col</th>
                                {result.lines.map((_, c) => (
                                  <th key={c} className="p-1.5 font-bold">Line {c+1}</th>
                                ))}
                              </tr>
                            </thead>
                            <tbody>
                              {result.lines.map((rLine, r) => (
                                <tr key={r} className="border-t border-slate-200">
                                  <td className="p-1.5 text-left font-bold">Line {r+1}</td>
                                  {result.lines.map((cLine, c) => (
                                    <td key={c} className="p-1.5 font-mono">
                                      {r === c ? '—' : `${Math.round((result.pairwiseMatrix[rLine.originalIndex]?.[cLine.originalIndex] || 0.5) * 100)}%`}
                                    </td>
                                  ))}
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}
                  </section>
                )}

                {/* The Apple Mail Lie Section */}
                <section className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200/80 mt-8">
                  <span className="text-[10px] font-mono font-bold uppercase text-rose-700 bg-rose-50 border border-rose-200 px-2 py-0.5 rounded-full">
                    Industry Reality
                  </span>
                  <h3 className="text-xl font-bold text-[#1E2032] mt-2">Why open rates are a 2026 fiction</h3>
                  <p className="text-xs sm:text-sm text-slate-500 mt-1">
                    Apple Mail Privacy Protection pre-fetches image pixels via proxy servers before humans read.
                  </p>

                  <div className="mt-4 p-4 rounded-2xl bg-slate-50 border border-slate-200">
                    <label className="text-xs font-bold text-slate-700 block mb-1">
                      Apple Mail share on your list: <span className="text-blue-600 font-mono">{appleShare}%</span>
                    </label>
                    <input
                      type="range"
                      min="10"
                      max="85"
                      value={appleShare}
                      onChange={(e) => setAppleShare(Number(e.target.value))}
                      className="w-full accent-[#2D2B44]"
                    />
                    <div className="grid grid-cols-3 gap-2 mt-3 text-center">
                      <div className="p-3 bg-white border border-rose-200 rounded-xl">
                        <span className="text-[10px] text-rose-700 font-bold block">Reported Open Rate</span>
                        <span className="text-xl font-bold font-mono text-rose-900">{Math.round(22 + appleShare * 0.55)}%</span>
                      </div>
                      <div className="p-3 bg-white border border-slate-200 rounded-xl">
                        <span className="text-[10px] text-slate-500 font-bold block">True Human Opens</span>
                        <span className="text-xl font-bold font-mono text-slate-800">~22%</span>
                      </div>
                      <div className="p-3 bg-white border border-emerald-200 rounded-xl">
                        <span className="text-[10px] text-emerald-700 font-bold block">Human Click Rate</span>
                        <span className="text-xl font-bold font-mono text-emerald-900">3.4%</span>
                      </div>
                    </div>
                  </div>
                </section>

                {/* FAQ Section */}
                <section className="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-slate-200/80 mt-8">
                  <h3 className="text-xl font-bold text-[#1E2032] mb-4">Frequently Asked Questions</h3>
                  <div className="space-y-3 text-xs sm:text-sm">
                    <div className="border border-slate-200 rounded-2xl p-4">
                      <div className="font-bold text-[#1E2032] mb-1">Why don't you score out of 100?</div>
                      <div className="text-slate-600">
                        Human inboxes are comparative arenas. Lines compete head-to-head. Absolute scores are statistical fiction.
                      </div>
                    </div>
                    <div className="border border-slate-200 rounded-2xl p-4">
                      <div className="font-bold text-[#1E2032] mb-1">What is the training dataset?</div>
                      <div className="text-slate-600">
                        27,616 real A/B trials from the Upworthy Research Archive published in Nature Scientific Data (2021).
                      </div>
                    </div>
                  </div>
                </section>
              </>
            )}

            {/* Methodology Full View */}
            {view === 'methodology' && (
              <div className="space-y-6">
                <div className="bg-white rounded-3xl p-8 border border-slate-200">
                  <h2 className="text-3xl font-extrabold text-[#1E2032]">Scientific Methodology</h2>
                  <p className="text-sm text-slate-600 mt-2">
                    SubjectRank models comparative reader psychology using peer-reviewed A/B records.
                  </p>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="p-6 bg-white rounded-2xl border border-slate-200">
                    <h3 className="font-bold text-sm mb-1">1. The 27,616 Trials</h3>
                    <p className="text-xs text-slate-600">Measured on real reader clicks across millions of impressions.</p>
                  </div>
                  <div className="p-6 bg-white rounded-2xl border border-slate-200">
                    <h3 className="font-bold text-sm mb-1">2. Bradley-Terry Equation</h3>
                    <p className="text-xs text-slate-600">P(A beats B) = 1 / (1 + exp(-(Score(A) - Score(B))))</p>
                  </div>
                </div>
              </div>
            )}

            {/* Live Archive View */}
            {view === 'archive' && (
              <div className="space-y-6">
                <div className="bg-white rounded-3xl p-8 border border-slate-200">
                  <h2 className="text-3xl font-extrabold text-[#1E2032]">Live Telemetry Archive</h2>
                  <p className="text-sm text-slate-600 mt-2">148,290 comparisons evaluated across 1,482 reported post-sends.</p>
                </div>
              </div>
            )}

            {/* API View */}
            {view === 'integrations' && (
              <div className="space-y-6">
                <div className="bg-white rounded-3xl p-8 border border-slate-200">
                  <h2 className="text-3xl font-extrabold text-[#1E2032]">REST API & Integrations</h2>
                  <pre className="bg-[#1E2032] text-blue-200 p-4 rounded-xl text-xs mt-3 overflow-x-auto">
                    POST https://api.subjectrank.org/v1/compare
                  </pre>
                </div>
              </div>
            )}

            {/* Footer */}
            <footer className="mt-12 pt-8 border-t border-slate-200 text-center text-xs text-slate-400">
              Training data: The Upworthy Research Archive, Matias et al. <em>Sci Data</em> 8, 195 (2021). SubjectRank © 2026.
            </footer>
          </div>

          {toast && (
            <div className="fixed bottom-6 right-6 bg-[#1E2032] text-white text-xs px-4 py-2.5 rounded-full shadow-lg z-50">
              {toast}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
